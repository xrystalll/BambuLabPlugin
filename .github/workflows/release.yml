name: Pack files and release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions: write-all
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm i
    
      - name: Install FlexCli
        run: npm install -g @eniac/flexcli

      - name: Build Plugin
        run: npm run build

      - name: Install native dependencies into plugin backend
        working-directory: com.xrystalll.bambu.plugin/backend
        run: npm install --omit=dev

      - name: Pack Plugin
        run: npm run plugin:pack

      - name: Rename artifact for OS
        shell: bash
        run: mv com.xrystalll.bambu.flexplugin com.xrystalll.bambu-${{ matrix.platform }}.flexplugin

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: com.xrystalll.bambu-${{ matrix.platform }}.flexplugin
